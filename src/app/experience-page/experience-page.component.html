<section class="site-network-page min-h-screen py-8 md:py-10 px-4 md:px-8">
  <div class="mx-auto max-w-7xl">
    <div class="text-center mb-7 md:mb-8 section-header">
      <!-- <span class="section-kicker">Our Experience</span> -->
      <h1 class="section-title mt-2">{{ sectionTitle }}</h1>
      <!-- <div class="section-divider" aria-hidden="true"></div> -->
      <p class="mt-3 text-sm md:text-base text-gray-600 max-w-5xl mx-auto leading-relaxed">
        {{ sectionContent }}
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[1.05fr_1fr] gap-5 md:gap-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 md:gap-3">
        <article
          *ngFor="let content of boxContent; let i = index"
          class="rounded-xl p-3 md:p-3.5 shadow-sm border border-[#bfdbfe] site-box flex gap-2.5 items-start"
          [class.alt]="i % 2 === 1"
        >
          <span class="site-box-accent shrink-0 mt-0.5" aria-hidden="true"></span>
          <p class="text-sm md:text-base font-semibold text-gray-800 leading-snug">
            {{ content }}
          </p>
        </article>
      </div>

      <div class="map-card rounded-xl border border-[#bfdbfe] shadow-sm p-3 md:p-4">
        <h2 class="text-xl md:text-2xl font-bold text-[#2563EB] mb-3 text-center">India Site Distribution</h2>

        <!-- <div class="india-map-wrap">
          <img
            class="india-map"
            src="/assets/image/india-outline.svg"
            alt="India map with site locations"
          />

          <div
            *ngFor="let dot of mapDots"
            class="map-dot"
            [style.top.%]="dot.top"
            [style.left.%]="dot.left"
            [attr.aria-label]="dot.city + ' (N=' + dot.count + ')'"
          >
            <span class="dot-core"></span>
            <span class="dot-label">{{ dot.city }} (N={{ dot.count }})</span>
          </div>
        </div> -->
        <!-- <div class="mobile-city-list">
          <span *ngFor="let dot of mapDots">{{ dot.city }} (N={{ dot.count }})</span>
        </div> -->
        <div id="map" class="w-full h-[500px] rounded-xl"></div>
      </div>
    </div>
  </div>
</section>
